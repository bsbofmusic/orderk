
[workspace]
members = [
  "crates/orderk-core",
  "crates/orderk-cli"
]
resolver = "2"

[workspace.package]
version = "0.1.23"
edition = "2021"
license = "MIT"
authors = ["orderk"]
repository = "https://github.com/bsbofmusic/orderk"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
hex = "0.4"
regex = "1.10"
rusqlite = { version = "=0.31.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlite-vec = "=0.1.9"
ureq = "=2.9.7"
url = "=2.4.1"
walkdir = "2.4"
