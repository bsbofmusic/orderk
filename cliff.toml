# git-cliff configuration for orderk
# Generates detailed release notes (RELEASE_NOTES.md) from conventional commits.
# See: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Release Notes

All notable changes to orderk are documented here (auto-generated by git-cliff).

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {{ commit.message | upper_first | trim }}\
            {% if commit.links %} ({{ commit.links | join(sep=", ") }}){% endif %}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
"""
# Write to RELEASE_NOTES.md (auto-generated detailed version)
# The human-curated CHANGELOG.md is maintained separately.
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^doc", group = "Documentation" },
    { message = "^refactor", group = "Changed" },
    { message = "^perf", group = "Changed" },
    { message = "^test", group = "Testing" },
    { message = "^ci", group = "CI" },
    { message = "^chore", group = "Misc" },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
